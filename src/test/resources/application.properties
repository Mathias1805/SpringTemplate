# ── Test configuration ────────────────────────────────────────────────────────
# Uses H2 in-memory database so integration tests run without infrastructure.

# Database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT
jwt.secret=test-secret-key-that-is-at-least-32-bytes-long
jwt.expiration=86400000

# Password salt
app.password.salt=test-salt

# Email (disabled for tests)
app.email.from=test@test.com
spring.mail.host=localhost
spring.mail.port=3025
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Disable unnecessary logging in tests
logging.level.org.hibernate.sql=WARN
logging.level.org.springframework.security=WARN
