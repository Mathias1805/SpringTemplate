spring.application.name=Template
spring.datasource.url=${DBURL}
spring.datasource.username=${DBUSER}
spring.datasource.password=${DBPASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.generate-ddl=true
logging.level.org.hibernate.sql=debug
logging.level.org.springframework.security=TRACE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Configuraci�n de async (opcional)
spring.task.execution.pool.keep-alive=60s
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.max-size=10
spring.task.execution.pool.core-size=3
spring.task.execution.thread-name-prefix=email-async-

# Configuraci�n de email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMUSER}
spring.mail.password=${EMPASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Password salt (SHA-256 para usuarios frontend)
app.password.salt=${PASSWORD_SALT}

# Email remitente
app.email.from=${EMAIL_FROM}

# Database pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# Rate limiting
# Activar solo si la app está detrás de un reverse proxy (nginx, ALB, etc.)
# que setea X-Forwarded-For de forma confiable.
app.rate-limit.trust-proxy=false